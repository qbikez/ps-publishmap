version: 1.0.{build}
image: Visual Studio 2022

# Push builds only on master; PR builds into master still run
branches:
  only:
    - master

install:
- git submodule update --init --recursive
- pwsh: scripts/lib/init.ps1
- pwsh: scripts/lib/restore.ps1
- pwsh: |
    ipmo require
    gmo require
    req configmap
- pwsh: qbuild init
- pwsh: qbuild restore
- pwsh: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
build_script:
# - pwsh: qbuild build # skip the old dotnet 1.0.0 native build
- pwsh: write-host "no need to build powershell"
test_script:
- pwsh: qbuild lint
- pwsh: qbuild test
artifacts:
- path: artifacts
- path: publishmap
deploy_script:
- pwsh: qbuild push . -buildno $env:APPVEYOR_BUILD_NUMBER